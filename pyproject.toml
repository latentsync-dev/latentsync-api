[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latentsync-api"
version = "0.1.0"
description = "Python client for a LatentSync-class lip sync API: audio-driven talking-head video through a hosted endpoint"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "latentsync-dev"}]
keywords = ["ai api", "avatar-4", "fabric-1.0", "latentsync", "latentsync api", "latentsync python", "synexa"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/latentsync-dev/latentsync-api"
Documentation = "https://latentsync-dev.github.io/latentsync-api/"
"Hosted model" = "https://synexa.ai/explore/veed/fabric-1.0?utm_source=github&utm_medium=ugc&utm_campaign=latentsync-dev&utm_content=pyproject&utm_term=tier-a"

[tool.setuptools.packages.find]
include = ["latentsync_api*"]
